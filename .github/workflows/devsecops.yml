# Pipeline DevSecOps - OWASP Juice Shop (fork del equipo)
# Fase 7: publicación de los reportes ya generados en el flujo de confianza.
# Umbrales de bloqueo documentados en security/politica-de-bloqueo.md
name: devsecops

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended_scans:
        description: Ejecutar además ZAP full scan y API scan activos (instancia propia)
        type: boolean
        required: false
        default: false

# Mínimo privilegio por defecto; cada job pide solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_VERSION: "1.182.1"
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # ------------------------------------------------------------------
  # 0. SECRETOS - gitleaks sobre los commits nuevos (PR o push)
  #    BLOQUEA: cualquier secreto nuevo.
  # ------------------------------------------------------------------
  secretos:
    name: secretos (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (versión fija + checksum)
        run: |
          curl --fail --silent --show-error --location -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz

      - name: Determinar rango de commits
        id: rango
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "opts=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "opts=${PUSH_BEFORE}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "opts=-1" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate de secretos
        env:
          LOG_OPTS: ${{ steps.rango.outputs.opts }}
        run: |
          gitleaks git --log-opts="$LOG_OPTS" --redact \
            --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Subir SARIF a Code Scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-gitleaks
          path: gitleaks.sarif
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 1. SAST - Semgrep (reglas OWASP + reglas propias en .semgrep/)
  #    BLOQUEA: hallazgos NUEVOS de severidad ERROR en el PR.
  #    AVISA:   WARNING / INFO y la deuda existente (va a Code Scanning).
  # ------------------------------------------------------------------
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Semgrep
        run: python3 -m pip install --quiet "semgrep==${SEMGREP_VERSION}"

      - name: Escaneo completo (reporte SARIF)
        run: |
          semgrep scan --metrics=off \
            --config p/owasp-top-ten --config p/javascript --config p/typescript \
            --config .semgrep/ \
            --sarif-output=semgrep.sarif --json-output=semgrep.json

      - name: Gate - solo hallazgos nuevos de severidad ERROR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --metrics=off \
            --config p/owasp-top-ten --config p/javascript --config p/typescript \
            --config .semgrep/ \
            --baseline-commit "$BASE_SHA" --severity ERROR --error

      - name: Subir SARIF a Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-semgrep
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2. SCA - SBOM CycloneDX (Syft) + vulnerabilidades (Grype) + licencias
  #    BLOQUEA: CVE CRITICAL con corrección disponible no exceptuada
  #             en .grype.yaml; licencias GPL/AGPL/SSPL.
  #    AVISA:   HIGH o menor; componentes sin licencia.
  # ------------------------------------------------------------------
  sca:
    name: sca (syft + grype)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Juice Shop no versiona package-lock.json (.npmrc: package-lock=false).
      # Sin lockfile el SBOM solo vería rangos de versión; se genera sin
      # instalar ni ejecutar scripts para resolver versiones exactas.
      - name: Resolver versiones exactas (lockfiles)
        run: |
          npm install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund
          npm --prefix frontend install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          test -s package-lock.json
          test -s frontend/package-lock.json

      - name: Generar SBOM CycloneDX (Syft)
        id: sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-cyclonedx.json
          upload-release-assets: false

      - name: Gate de vulnerabilidades (Grype)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          config: .grype.yaml
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif
          output-file: grype.sarif

      - name: Reporte de Grype (todas las severidades, solo informativo)
        if: always() && steps.sbom.outcome == 'success'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          config: .grype.yaml
          fail-build: false
          output-format: json
          output-file: grype.json

      - name: Gate de licencias
        if: always() && steps.sbom.outcome == 'success'
        run: python3 .github/scripts/check-licenses.py < sbom.cdx.json

      - name: Subir SARIF a Code Scanning
        if: always() && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: grype.sarif
          category: grype

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-sca
          path: |
            sbom.cdx.json
            grype.sarif
            grype.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 3. BUILD - imagen de contenedor (solo si secretos, SAST y SCA pasan)
  #    Usa infra/Dockerfile y las restricciones de infra/compose.yaml.
  # ------------------------------------------------------------------
  build:
    name: build (docker)
    runs-on: ubuntu-24.04
    needs: [secretos, sast, sca]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar política de despliegue
        run: |
          python3 -m unittest discover -s infra -p 'test_*.py'
          docker compose -f infra/compose.yaml config --format json > compose.json
          python3 infra/check-compose.py < compose.json > compose-policy.json

      - name: Construir y comprobar imagen endurecida
        env:
          JUICE_SHOP_IMAGE: juice-shop:${{ github.sha }}
        run: |
          docker build -f infra/Dockerfile \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$JUICE_SHOP_IMAGE" .
          cleanup() {
            status=$?
            docker compose -p juice-shop-ci -f infra/compose.yaml logs
            docker compose -p juice-shop-ci -f infra/compose.yaml down --remove-orphans
            exit "$status"
          }
          trap cleanup EXIT
          docker compose -p juice-shop-ci -f infra/compose.yaml up --no-build --wait --wait-timeout 240
          docker compose -p juice-shop-ci -f infra/compose.yaml exec -T juice-shop \
            /nodejs/bin/node -e 'process.exit(process.getuid() === 65532 ? 0 : 1)'
          curl --fail http://127.0.0.1:3000/ > /dev/null
          docker inspect "$(docker compose -p juice-shop-ci -f infra/compose.yaml ps -q juice-shop)" > contenedor-smoke.json
          docker save "$JUICE_SHOP_IMAGE" | gzip > imagen.tar.gz

      - name: Guardar validación del despliegue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-despliegue
          path: |
            compose.json
            compose-policy.json
            contenedor-smoke.json
          if-no-files-found: error

      - name: Guardar imagen para los jobs iac y dast
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagen-juice-shop
          path: imagen.tar.gz
          retention-days: 7

  # 4. IaC y contenedor: escanear exactamente la imagen del build.
  iac:
    name: iac (checkov + trivy)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Descargar imagen del build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: imagen-juice-shop
          path: imagen-build

      - name: Cargar imagen e instalar Trivy verificado
        id: preparar
        run: |
          mkdir -p reports
          gzip -dc imagen-build/imagen.tar.gz | docker load
          docker image inspect "juice-shop:${GITHUB_SHA}" > reports/imagen.json
          curl --fail --silent --show-error --location \
            -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
          ./trivy --version > reports/trivy-version.txt

      - name: Gate Checkov (Dockerfile de infra)
        id: checkov
        run: |
          mkdir -p reports
          set +e
          docker run --rm --volume "$PWD:/src:ro" \
            bridgecrew/checkov:3.4.7@sha256:2df9b825a73bf4d09f0ab0d71b12844801454c3c35430162e7e2cf0e60e34e40 \
            --file /src/infra/Dockerfile --framework dockerfile --skip-download \
            --output json > reports/checkov.json
          status=$?
          set -e
          python3 -c 'import json; s=json.load(open("reports/checkov.json"))["summary"]; assert s["resource_count"] > 0 and s["parsing_errors"] == 0, s'
          exit "$status"

      - name: Reporte completo Trivy (imagen)
        if: always() && steps.preparar.outcome == 'success'
        id: trivy
        run: |
          ./trivy image --scanners vuln --exit-code 0 --timeout 15m \
            --format json --output reports/trivy-image.json "juice-shop:${GITHUB_SHA}"
          test -s reports/trivy-image.json

      - name: Gate Trivy (CRITICAL con corrección)
        if: always() && steps.trivy.outcome == 'success'
        run: |
          ./trivy image --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --timeout 15m --format json \
            --output reports/trivy-gate.json "juice-shop:${GITHUB_SHA}"
          test -s reports/trivy-gate.json

      - name: Guardar reportes de IaC y contenedor
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-iac-contenedor
          path: reports/
          if-no-files-found: error
          retention-days: 14

  # 5. DAST: la imagen aprobada por IaC, en red interna, sin servicios externos.
  dast:
    name: dast (zap)
    runs-on: ubuntu-24.04
    needs: [build, iac]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Descargar imagen del build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: imagen-juice-shop
          path: imagen-build

      - name: Cargar imagen y probar validadores
        run: |
          gzip -dc imagen-build/imagen.tar.gz | docker load
          python3 -m unittest discover -s .zap -p 'test_*.py'
          docker compose -f infra/compose.yaml -f infra/compose.dast.yaml config --format json > compose-dast.json
          python3 infra/check-compose.py < compose-dast.json

      - name: Ejecutar ZAP y verificar cobertura y autenticación
        id: zap
        env:
          EXTENDED_SCANS: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_scans || false }}
        run: bash .zap/scan.sh "juice-shop:${GITHUB_SHA}" "$EXTENDED_SCANS"

      - name: Conservar solo reportes saneados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-dast
          path: ${{ steps.zap.outputs.report_dir || 'reports/dast-not-created' }}
          if-no-files-found: error
          retention-days: 14

  # Verificación real sin servidores externos ni credenciales permanentes.
  publicacion:
    name: publicacion (inventarios)
    needs: [secretos, sast, sca, iac, dast]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: reporte-*
          path: artefactos-seguridad
      - name: Probar publicador y controles de limpieza
        run: python3 -m unittest discover -s .aspm -p 'test_*.py'
      - name: Publicar en servicios temporales y verificar inventarios
        id: inventarios
        run: bash .aspm/publish.sh "$GITHUB_WORKSPACE/artefactos-seguridad"
      - name: Conservar recibos sin credenciales
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-publicacion
          path: ${{ steps.inventarios.outputs.report_dir || 'reports/publicacion-no-iniciada' }}
          if-no-files-found: error
          retention-days: 30

  publicacion_remota:
    name: publicacion remota (opcional)
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'Daniel-1A/juice-shop-sast' &&
      vars.PUBLISH_SECURITY_REPORTS == 'true'
    needs: [sast, sca, iac, dast]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: seguridad-publicacion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: reporte-*
          path: artefactos-seguridad
      - name: Publicar hallazgos y SBOM
        env:
          DOJO_URL: ${{ vars.DOJO_URL }}
          DOJO_PRODUCT_NAME: ${{ vars.DOJO_PRODUCT_NAME }}
          DOJO_ENGAGEMENT_NAME: ${{ vars.DOJO_ENGAGEMENT_NAME }}
          DOJO_API_TOKEN: ${{ secrets.DOJO_API_TOKEN }}
          DTRACK_URL: ${{ vars.DTRACK_URL }}
          DTRACK_PROJECT_ID: ${{ vars.DTRACK_PROJECT_ID }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: python3 .github/scripts/publish-reports.py artefactos-seguridad --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
